- id: S-2
  title: "Benchpress"
  description: "Benchpress started out from an idea to solve the benchmarking problem for causal discovery and structure learning once and for all. It has grown into a platform that also enables practitioners and researchers to access state-of-the-art open source algorithms for analysis without any coding. It requires minimal installation and scales seamlessly thanks to Snakemake."
  repo: felixleopoldo/benchpress
